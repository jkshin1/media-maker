 }

function liveAnalysis(task,comparison=false){

function cinematicComparison(task,cut){

function phaseMarkup(task,cut){
 const before=cut.phase==='before',comparison=cut.phase==='before_after_comparison',panel=cut.phase==='after_analysis'?(task.id===3?3:4):2;
 const content=comparison?cinematicComparison(task,cut):photoScene(task,panel,before)+(before?liveSourceCards(task):cut.phase==='after_action'?liveAction(task):liveAnalysis(task));
 return '<div class="cutContent">'+content+'</div><div class="phaseMeta '+(comparison?'comparePhaseMeta':'')+'"><span class="phasePill '+(before?'before':'after')+'">'+esc(cut.cutlabel)+'</span><h3 class="phaseHeading">'+esc(cut.caption)+'</h3></div>';

function animateLayer(layer,task,cut,elapsed){
 const p=clamp(elapsed/4),entry=ease(elapsed/.52),phase=cut.phase,kind=infer(task);
 layer.querySelectorAll('.cameraPhoto').forEach((img,i)=>{
  const side=(task.id%2?1:-1),zoom=phase==='before'?1.015+.025*p:1.01+.065*p;
  img.style.transform='translate('+((p-.5)*side*(phase==='before'?16:34))+'px,'+((p-.5)*(task.id%3-1)*15)+'px) scale('+zoom+')';
 });
 layer.querySelectorAll('.photoBackdrop').forEach(el=>el.style.transform='translateX('+((p-.5)*-22)+'px) scale(1.12)');
 layer.querySelectorAll('.cinemaUI').forEach(el=>{
  const comparison=el.classList.contains('compareUI'),yaw=comparison?-3.5:-8+(task.id%3)*1.5;
  el.style.transform='perspective(2000px) rotateY('+(yaw+p*2.3)+'deg) rotateX('+(1.8-p*1.5)+'deg) rotateZ(-.65deg) translate3d('+((1-entry)*75-p*7)+'px,'+((1-entry)*20-p*5)+'px,0)';
  el.style.opacity=comparison?.92:entry;
 });
 layer.querySelectorAll('.monitorSupport').forEach(el=>{el.style.transform='perspective(1800px) rotateY('+(-6+p*2)+'deg) translateY('+((1-entry)*20)+'px)';el.style.opacity=entry;});
 layer.querySelectorAll('[data-type-text]').forEach((el,i)=>{
  const full=el.dataset.typeText,n=Math.floor(clamp((elapsed-.18-i*.16)/1.18)*full.length);
  el.textContent=full.slice(0,n);const cursor=document.createElement('i');cursor.className='typeCursor';cursor.style.opacity=elapsed<1.6?String(.35+.65*(.5+.5*Math.cos(elapsed*14))):'0';el.appendChild(cursor);
 });
 layer.querySelectorAll('.motionNode').forEach((el,i)=>{
  const n=Number(el.dataset.node||0),v=ease((elapsed-(phase==='before'?.13:phase==='after_action'?1.0:.35)-n*.2)/.64);
  if(el.classList.contains('floatingSource')){
   const r=Number(el.dataset.rotation),dx=Math.sin(elapsed*1.18+n*1.8)*(9+n*2),dy=Math.cos(elapsed*.92+n*2)*8;
   el.style.transform='translate('+((1-v)*38+dx)+'px,'+((1-v)*24+dy)+'px) rotate('+(r+Math.sin(elapsed*.7+n)*.8)+'deg)';
  }else el.style.transform='translateY('+((1-v)*19)+'px) scale('+(1-(1-v)*.025)+')';
  el.style.opacity=phase==='before'?.48+.52*v:v;
  const selected=phase==='after_action'?elapsed>1.3+n*.21&&elapsed<2.6+n*.19:elapsed>2.45+n*.2;
  el.classList.toggle('nodeSelected',selected);
 });
 layer.querySelectorAll('.drawline').forEach((path,i)=>{
  path.style.strokeDashoffset=1-ease((elapsed-.45-(i%4)*.17)/2.65);
 });
 layer.querySelectorAll('.step').forEach(el=>{
  const n=Number(el.dataset.step||0),v=ease((elapsed-.15-n*.36)/.72);el.style.opacity=v;el.style.transform='translateY('+((1-v)*12)+'px)';
 });
 layer.querySelectorAll('.liveStatus b').forEach(el=>el.style.transform='scaleX('+clamp((elapsed-.25)/3.5)+')');
 layer.querySelectorAll('.flowSignal').forEach((el,i)=>{
  const q=(elapsed*.32+i*.33)%1,x=58+864*q,y=315+Math.sin(q*Math.PI)*41;el.setAttribute('cx',x);el.setAttribute('cy',y);el.style.opacity=elapsed>1.05?'1':'0';
 });
 layer.querySelectorAll('.sourceSignal').forEach((el,i)=>{const q=(elapsed*.34+i*.31)%1;el.setAttribute('cx',190+300*q);el.setAttribute('cy',122+225*q);el.style.opacity=.4+.45*Math.sin(q*Math.PI)});
 layer.querySelectorAll('.scanBeam').forEach(el=>el.style.transform='translateX('+(-45+470*clamp((elapsed-.25)/3.65))+'px)');
 layer.querySelectorAll('.scanLine').forEach(el=>el.style.transform='translateY('+(12+263*clamp((elapsed-.4)/3.4))+'px)');
 layer.querySelectorAll('.roi').forEach(el=>{const v=ease((elapsed-1.8)/.7);el.style.opacity=v;el.style.transform='scale('+(1.35-.35*v)+')';});
 layer.querySelectorAll('.measureLine').forEach((el,i)=>el.style.strokeDashoffset=1-ease((elapsed-.6-i*.65)/1.15));
 layer.querySelectorAll('.measurementValue').forEach(el=>el.style.opacity=ease((elapsed-2.35)/.5));
 layer.querySelectorAll('.parameterSweep div').forEach(el=>el.style.transform='translateX('+(clamp((elapsed-.75)/3.1)*430-25)+'px)');
 layer.querySelectorAll('.comparisonSweep').forEach(el=>{el.style.left=(960+Math.sin(p*Math.PI)*140)+'px';el.style.opacity=.4+.6*Math.sin(p*Math.PI)});
 layer.querySelectorAll('.afterHalf').forEach(el=>el.style.clipPath='inset(0 0 0 '+((1-ease(elapsed/3.6))*180)+'px)');
 layer.querySelectorAll('.compareUI .analysisArt').forEach(el=>el.style.clipPath='none');
 layer.querySelectorAll('.statusText').forEach(el=>el.textContent=phase==='after_action'?(elapsed<1.4?'질문 입력':elapsed<2.7?'정보 연결':'연결 완료'):task.id===12?(elapsed<2.6?'검토 대상 선별':'담당자 최종 판정'):(elapsed<2.55?'데이터 분석':'결과 확인'));
 window.__motionState={task_id:task.id,phase,elapsed:Number(elapsed.toFixed(4)),motion_kind:phase==='before'?'task-work-and-fragmented-sources':phase==='after_action'?(taskVisuals[task.id].sources?'source-integration-flow':'typed-query-and-selection'):phase==='after_analysis'?(task.id===9?'tem-alignment-and-measurement':task.id===11?'overlay-vector-and-parameter-sweep':task.id===12?'plug-scan-roi-human-review':'scan-and-chart-draw'):'photographic-before-after-wipe',progress:p,typing:clamp((elapsed-.18)/1.18),data_flow:(elapsed*.32)%1,chart_draw:ease((elapsed-.45)/2.65),scan:clamp((elapsed-.25)/3.65),ui_camera_yaw:-8+p*2.3,typed_chars:[...layer.querySelectorAll('[data-type-text]')].reduce((sum,el)=>sum+(el.childNodes[0]?.textContent.length||0),0),connected_nodes:Math.min(5,Math.floor(clamp((elapsed-1)/2.7)*5)),scanned_rows:Math.floor(clamp((elapsed-.25)/3.65)*6),comparison_reveal:clamp((elapsed-.1)/3.55),human_final_review:task.id===12&&elapsed>=2.6};
}
function progressMarkup(active=3){return ['01 · BEFORE','02 · AFTER 연결','03 · AFTER 분석','04 · BEFORE / AFTER'].map((s,i)=>'<span class="'+(i===active?'active':i<active?'done':'')+'">'+s+'</span>').join('')}
function previousMarkup(task){
 const cut=task.cuts.at(-1);return '<div class="taskHeader"><span class="taskNo">'+String(task.id).padStart(2,'0')+'</span><h2 class="taskTitle">'+esc(task.short_title)+'</h2><div class="taskOwner">'+esc(task.team)+'<br>'+esc(task.owner)+' TL</div></div><div class="phaseRoot">'+phaseMarkup(task,cut)+'</div><div class="taskCaption">'+esc(cut.narration)+'</div><div class="phaseProgress">'+progressMarkup()+'</div>';

function loadTask(task,index){
 currentTask=index;const no=String(task.id).padStart(2,'0');
 const balancedTitles={1:'Smart Process Architecture\nAI Agent',2:'장비 Daily Report\nAuto Mail System',3:'Thinfilm Agent -\nBEOL Thinfilm',4:'C&C Working Board 내\nAI Agent 구축',5:'LLM을 활용한 C&C 공정\nInline Data 관리',6:'R&D 공정 Eng’r 연구 환경\nInfra 구축',7:'경비 분석 및 절감 아이템 발굴\nAgent 개발',8:'공정 Monitoring Data 자연어 검색\n및 시각화 Agent',9:'TCAD-TEM 이미지 연계를 통한\n이미지 Labeling Tool 개발',10:'Cubic공정Lab 전용\nApp&Agent',11:'RSAB SNM Overlay\n열화 원인 분석 및\n솔루션 제시 Agent',12:'AI Agent 기반 Plug\n대면적 데이터 분석 자동화 및\n인사이트 도출'};
 $('introNumber').textContent=no;$('introTitle').textContent=balancedTitles[task.id]||task.title;
 $('introTeam').textContent=task.team+'  ·  '+task.owner+' TL';$('introCore').textContent=task.core_message;
 $('introTexture').style.backgroundImage='url("'+task.before_asset+'")';
 $('taskNo').textContent=no;$('taskTitle').textContent=task.short_title||task.title;$('taskTitle').style.fontSize=(task.short_title||task.title).length>32?'39px':'46px';
 $('taskOwner').innerHTML=esc(task.team)+'<br>'+esc(task.owner)+' TL';
 $('phaseRoot').innerHTML=task.cuts.map((cut,i)=>'<div class="cutLayer" data-cut="'+i+'">'+phaseMarkup(task,cut)+'</div>').join('');
 $('previousBody').innerHTML=index>0?previousMarkup(story.tasks[index-1]):'';
 if(index>0){const previous=story.tasks[index-1];animateLayer($('previousBody'),previous,previous.cuts.at(-1),4);}
}
function renderTask(task,index,t){
 if(currentTask!==index)loadTask(task,index);
 const local=t-task.start,titleSeconds=Number(task.title_seconds??2),intro=ease(local/.28)*(1-ease((local-titleSeconds)/.25)),body=ease((local-titleSeconds)/.25);
 const underlayOpacity=index>0?1-ease(local/.28):0;$('previousBody').style.display=underlayOpacity>0?'block':'none';$('previousBody').style.opacity=underlayOpacity;
 $('taskIntro').style.opacity=intro;$('taskIntro').style.display=intro>0?'block':'none';$('taskIntro').style.transform='translateX('+((1-ease(local/.55))*42)+'px)';
 $('introStageRoute').style.transform='scaleX('+ease(local/1.7)+')';$('introLightSweep').style.left=(120+1500*clamp(local/2))+'px';
 $('introTexture').style.transform='perspective(1600px) rotateY('+(-7+local*2)+'deg) scale('+(1.03+local*.015)+')';
 $('taskBody').style.opacity=body;$('taskBody').style.display=body>0?'block':'none';$('taskBody').style.transform='none';
 let active=Math.max(0,task.cuts.findLastIndex(cut=>t>=cut.start));
 $('phaseRoot').querySelectorAll('.cutLayer').forEach((layer,i)=>{
  const cut=task.cuts[i],elapsed=t-cut.start,entry=ease(elapsed/.32),exit=i===task.cuts.length-1?1:1-ease((t-cut.end)/.25),opacity=entry*exit;
  layer.style.display=opacity>0?'block':'none';layer.style.opacity=opacity;layer.style.transform='none';
  if(opacity>0)animateLayer(layer,task,cut,elapsed);
 });
 if(body===0)window.__motionState={task_id:task.id,phase:'title',elapsed:local,motion_kind:'gold-route-and-title-camera',progress:clamp(local/2)};
 $('taskCaption').textContent=task.cuts[active].narration;$('phaseProgress').innerHTML=progressMarkup(active);
 $('footerPhase').textContent=String(task.id).padStart(2,'0')+' / '+story.tasks.length+'  ·  '+task.owner;
}
function renderEnding(t){
 const local=t-story.ending.start,entry=ease(local/1.2);$('endingText').style.opacity=entry;$('endingText').style.transform='translateY('+((1-entry)*35)+'px)';$('endImage').style.transform='scale('+(1.04+local*.003)+')';
 routeMotion('endRoutes',local);window.__motionState={phase:'ending',elapsed:local,motion_kind:'horizon-camera-and-gold-route',progress:local/10};
 $('endingLock').style.opacity=ease((local-3.6)/1.4);$('endingLock').style.transform='translateY('+((1-ease((local-3.6)/1.4))*20)+'px)';$('footerPhase').textContent='TOWARD A BETTER TOMORROW';
}
function update(t){
 t=clamp(t,0,story.duration_seconds);const inOpen=t<story.opening.end,inEnd=t>=story.ending.start;
 $('opening').style.display=inOpen?'block':'none';$('task').style.display=!inOpen&&!inEnd?'block':'none';$('ending').style.display=inEnd?'block':'none';
 if(inOpen)renderOpening(t);else if(inEnd)renderEnding(t);else {const index=story.tasks.findIndex(task=>t>=task.start&&t<task.end);if(index>=0)renderTask(story.tasks[index],index,t)}
 $('ambient').style.transform='translateX('+Math.sin(t*.05)*25+'px) scale('+(1+t*.00015)+')';
 $('field').style.transform='translateY('+Math.sin(t*.12)*8+'px)';
 $('timelineFill').style.transform='scaleX('+t/story.duration_seconds+')';
 $('dots').querySelectorAll('b').forEach((b,i)=>{const task=story.tasks[i];b.style.transform='scaleX('+clamp((t-task.start)/(task.end-task.start))+')';b.parentElement.style.opacity=t>=task.start&&t<task.end?'1':'.65'});
 $('black').style.opacity=Math.max(1-ease(t/.7),ease((t-(story.duration_seconds-.65))/.65));
}
function initField(){
 const random=seeded(20261013);let s='';
 for(let i=0;i<46;i++){const x=random()*1920,y=random()*1080,r=1+random()*2;s+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#e7c78b" opacity="'+(.08+random()*.27)+'"/>';if(i%4===0)s+='<path d="M'+x+' '+y+'h'+(70+random()*190)+'" stroke="#e8c58418"/>'}
 $('field').innerHTML=s;

 $('openWafer').innerHTML='<svg viewBox="0 0 930 850"><g transform="translate(0 90) rotate(-12 460 330)"><ellipse cx="465" cy="363" rx="391" ry="209" fill="#c1883022" stroke="#efcc8977"/><g transform="translate(45 -20) scale(1 .62)">'+wafer(420,580,375,42)+'</g><path d="M70 412C279 306 682 269 863 397" fill="none" stroke="#f3d79755" stroke-width="2"/></g></svg>';
 $('endFallback').innerHTML='<svg viewBox="0 0 1920 1080" style="position:absolute;inset:0;width:100%;height:100%;opacity:.55"><defs><radialGradient id="earthglow"><stop stop-color="#b9853633"/><stop offset="1" stop-color="#07070600"/></radialGradient></defs><ellipse cx="960" cy="950" rx="1100" ry="420" fill="url(#earthglow)"/><path d="M-180 1090C160 465 1700 465 2100 1090" fill="none" stroke="#f2d49388" stroke-width="3"/><path d="M-170 1110C165 510 1710 510 2090 1110" fill="none" stroke="#ae823555"/>'+Array.from({length:40},(_,i)=>{const x=170+i*40,h=20+(i*71%170);return '<rect x="'+x+'" y="'+(930-h)+'" width="6" height="'+h+'" fill="#d3ac6866"/>'}).join('')+'</svg>';
}
const preloadedTaskImages=[],decodedSeekImages=new WeakMap();
const loadImage=img=>new Promise(resolve=>{if(img.complete)return resolve();img.onload=()=>resolve();img.onerror=()=>{img.style.display='none';resolve()}});
window.__ready=(async()=>{
 const response=await fetch('../storyboard.json');if(!response.ok)throw Error('storyboard.json could not be loaded');story=await response.json();
 const motionResponse=await fetch('../concept/motion-reference-20261014.json');if(!motionResponse.ok)throw Error('Motion reference could not be loaded');motionReference=await motionResponse.json();
 if(story.tasks.length!==12)throw Error('Expected 12 tasks');
 $('dots').innerHTML=story.tasks.map(()=>'<i><b></b></i>').join('');initField();
 const assetPaths=[...new Set(story.tasks.flatMap(task=>{
  if(!task.before_asset)throw Error('Task BEFORE asset is required: '+task.id);
  return [task.source_image||('../../'+task.source_file),task.before_asset,...Object.values(motionReference.tasks.find(t=>t.task_id===task.id).photo_assets).map(a=>a.html_src)];
 }))];
 const assetLoads=assetPaths.map(src=>{
  const img=new Image();preloadedTaskImages.push(img);
  return new Promise((resolve,reject)=>{img.onload=async()=>{try{await img.decode();resolve()}catch(error){reject(Error('Task image could not be decoded: '+src))}};img.onerror=()=>reject(Error('Task image failed to load: '+src));img.src=src});
 });
 await Promise.all([document.fonts.ready,loadImage($('hero')),loadImage($('endImage')),...assetLoads]);if($('endImage').naturalWidth)$('endFallback').style.display='none';update(0);
 window.__assetStatus={status:'PASS',loaded:assetPaths.length,paths:assetPaths};
})();
window.__seek=async t=>{
 await window.__ready;update(t);
 await Promise.all([...document.images].filter(img=>decodedSeekImages.get(img)!==(img.currentSrc||img.src)).map(async img=>{
  if(img.style.display==='none')return;
  try{await img.decode()}catch(error){throw Error('Frame image could not be decoded: '+img.src)}
  if(!img.naturalWidth)throw Error('Frame image is empty: '+img.src);decodedSeekImages.set(img,img.currentSrc||img.src);
 }));
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
};
const RENDER=new URLSearchParams(location.search).has('render');
if(!RENDER){const fit=()=>{const scale=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform='translate('+((innerWidth-1920*scale)/2)+'px,'+((innerHeight-1080*scale)/2)+'px) scale('+scale+')'};fit();addEventListener('resize',fit);window.__ready.then(()=>{const begin=performance.now();const loop=()=>{update(((performance.now()-begin)/1000)%story.duration_seconds);requestAnimationFrame(loop)};loop()})}
